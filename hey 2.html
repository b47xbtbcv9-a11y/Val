<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Valentinstag 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: linear-gradient(135deg, #ff5f9e, #ff8fb1);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.card {
    background: white;
    padding: 30px 25px;
    border-radius: 20px;
    text-align: center;
    max-width: 330px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

h1 {
    color: #e60073;
}

p {
    color: #444;
    line-height: 1.5;
}

.buttons {
    margin-top: 20px;
    position: relative;
    height: 120px;
}

button {
    padding: 14px 22px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: absolute;
}

#yesBtn {
    background: #e60073;
    color: white;
    left: 50%;
    transform: translateX(-50%);
}

#noBtn {
    background: #ccc;
    color: #333;
}

.hidden {
    display: none;
}

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    to { transform: translateY(-120vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="card">
    <h1>💖 Valentinstag 💖</h1>
    <p id="text">
        Ich möchte dich zu einem besonderen Abend einladen.<br><br>
        <strong>14. Februar · 19:00 Uhr</strong>
    </p>

    <div class="buttons">
        <button id="yesBtn" onclick="yesClicked()">Ja 💌</button>
        <button id="noBtn">Nein 🙃</button>
    </div>
</div>

<audio id="sound">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-romantic-piano-melody-187.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("noBtn");

function moveNoButton() {
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 80;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

noBtn.addEventListener("touchstart", moveNoButton);
noBtn.addEventListener("mouseover", moveNoButton);

function yesClicked() {
    document.getElementById("sound").play();

    document.getElementById("text").innerHTML =
        "💘 Gute Wahl! 💘<br><br>" +
        "Dann gehört dieser Abend ganz uns.<br>" +
        "Ich freu mich auf dich ❤️";

    document.querySelector(".buttons").classList.add("hidden");

    for (let i = 0; i < 30; i++) createHeart();
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 25) + "px";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
</script>

</body>
</html>
